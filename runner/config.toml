[benchmarks.dedup]
location = "removeDuplicates"
algorithm = "parlayhash"
input = "${REPO_ROOT}/inputs/expt-500M" 

[benchmarks.isort]
location = "integerSort"
algorithm = "parallelRadixSort"
input = "${REPO_ROOT}/inputs/expt-500M"

[benchmarks.sort]
location = "comparisonSort"
algorithm = "sampleSort"
input = "${REPO_ROOT}/inputs/expt-1B"

[benchmarks.histogram]
location = "histogram"
algorithm = "parallel"
input = "${REPO_ROOT}/inputs/expt-500M"
buckets = 500000000

[benchmarks.MIS]
location = "maximalIndependentSet"
algorithm = "incrementalMIS"
input = "${REPO_ROOT}/inputs/Hyperlink2012-Hosts.sym.ag"
# input = "${REPO_ROOT}/inputs/USA-road-d-USA.sym.wag"

[benchmarks.matching]
location = "maximalMatching"
algorithm = "incrementalMatching"
input = "${REPO_ROOT}/inputs/rmat-50M.ea"
# input = "${REPO_ROOT}/inputs/USA-road-d-USA.sym.wag"

[benchmarks.ST]
location = "spanningForest"
algorithm = "incrementalST"
input = "${REPO_ROOT}/inputs/rmat-50M.ea"
# input = "${REPO_ROOT}/inputs/Hyperlink2012-Hosts.sym.ag"
# input = "${REPO_ROOT}/inputs/USA-road-d-USA.sym.wag"

