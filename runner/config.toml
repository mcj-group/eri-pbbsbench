[benchmarks.SA]
location = "suffixArray"
algorithm = "parallelRange"
input = "${REPO_ROOT}/inputs/wikipedia250M.txt"

[benchmarks.bw]
location = "BWDecode"
algorithm = "listRank"
input = "${REPO_ROOT}/inputs/wikipedia250M.txt"

[benchmarks.lrs]
location = "longestRepeatedSubstring"
algorithm = "doubling"
input = "${REPO_ROOT}/inputs/wikipedia250M.txt"

