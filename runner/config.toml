[benchmarks.dedup]
location = "removeDuplicates"
algorithm = "parlayhash"
input = "${REPO_ROOT}/inputs/expt-500M" 

[benchmarks.isort]
location = "integerSort"
algorithm = "parallelRadixSort"
input = "${REPO_ROOT}/inputs/expt-500M"

[benchmarks.sort]
location = "comparisonSort"
algorithm = "sampleSort"
input = "${REPO_ROOT}/inputs/expt-1B"

[benchmarks.histogram]
location = "histogram"
algorithm = "parallel"
input = "${REPO_ROOT}/inputs/expt-500M"
buckets = 500000000

[benchmarks.MIS]
location = "maximalIndependentSet"
algorithm = "incrementalMIS"
input = "${REPO_ROOT}/inputs/Hyperlink2012-Hosts.sym.ag"

[benchmarks.matching]
location = "maximalMatching"
algorithm = "incrementalMatching"
input = "${REPO_ROOT}/inputs/rmat-50M.ea"

[benchmarks.ST]
location = "spanningForest"
algorithm = "incrementalST"
input = "${REPO_ROOT}/inputs/rmat-20M.ea"

[benchmarks.MST]
location = "minSpanningForest"
algorithm = "parallelKruskal"
input = "${REPO_ROOT}/inputs/rmat-20M.wea"

[benchmarks.SA]
location = "suffixArray"
algorithm = "parallelRange"
input = "${REPO_ROOT}/inputs/wikipedia250M.txt"

[benchmarks.bw]
location = "BWDecode"
algorithm = "listRank"
input = "${REPO_ROOT}/inputs/wikipedia250M.txt"

[benchmarks.lrs]
location = "longestRepeatedSubstring"
algorithm = "doubling"
input = "${REPO_ROOT}/inputs/wikipedia250M.txt"

[benchmarks.refine]
location = "delaunayRefine"
algorithm = "incrementalRefine"
input = "${REPO_ROOT}/inputs/dt_k2M"